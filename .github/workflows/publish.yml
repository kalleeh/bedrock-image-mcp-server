name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Check the tag matches every version site
        # The version lives in three places (project, commitizen, __version__) and has to be
        # bumped by hand, so a release can be tagged before all three agree. Publishing is
        # irreversible, so refuse rather than ship a wheel whose metadata disagrees with
        # its tag.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(sed -n '/^\[project\]/,/^\[/p' pyproject.toml | grep -m1 '^version = ' | cut -d'"' -f2)
          commitizen=$(sed -n '/^\[tool.commitizen\]/,/^\[/p' pyproject.toml | grep -m1 '^version = ' | cut -d'"' -f2)
          module=$(grep -m1 '^__version__ = ' awslabs/bedrock_image_mcp_server/__init__.py | cut -d"'" -f2)
          echo "tag=$tag project=$project commitizen=$commitizen module=$module"
          if [ "$tag" != "$project" ] || [ "$tag" != "$commitizen" ] || [ "$tag" != "$module" ]; then
            echo "::error::Release tag v$tag does not match every version site"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint, type-check and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bedrock-image-mcp-server
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
