name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest --cov=awslabs --cov-report=term-missing

  fresh-install:
    name: Fresh unlocked install (Python ${{ matrix.python-version }})
    # The `test` job installs with `uv sync --frozen`, i.e. from uv.lock — so it keeps
    # passing even when the declared ranges resolve to something broken. That is exactly
    # how mcp 2.0 shipped a breaking change past a green CI: the lockfile pinned mcp 1.x
    # while every real `uvx bedrock-image-mcp-server@latest` resolved to 2.x and died at
    # import. This job deliberately ignores the lockfile and resolves fresh from the
    # declared dependencies, then boots the server over stdio like a client would.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build the wheel
        run: uv build --out-dir dist

      - name: Install the wheel with freshly resolved dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .fresh
          uv pip install --python .fresh --no-cache dist/*.whl

      - name: Report the resolved mcp version
        run: uv pip list --python .fresh | grep -E '^mcp '

      - name: Boot the server over stdio and list tools
        # No AWS credentials needed: initialize + tools/list never reach Bedrock. This
        # fails loudly on an import-time crash, which is the failure mode being guarded.
        #
        # stdin is held open until the response arrives, the way a real client behaves.
        # Piping a file in and letting it hit EOF does not work: under mcp 2.x the server
        # can exit on EOF before it has drained the requests already in the buffer, which
        # made this probe race and drop the tools/list reply about a third of the time.
        run: |
          python - <<'PY'
          import json, subprocess, sys, threading

          requests = [
              {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {
                  'protocolVersion': '2024-11-05',
                  'capabilities': {},
                  'clientInfo': {'name': 'ci', 'version': '1'},
              }},
              {'jsonrpc': '2.0', 'method': 'notifications/initialized'},
              {'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'},
          ]

          server = subprocess.Popen(
              ['.fresh/bin/bedrock-image-mcp-server'],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              text=True,
          )
          watchdog = threading.Timer(60, server.kill)
          watchdog.start()
          try:
              assert server.stdin is not None and server.stdout is not None
              for request in requests:
                  server.stdin.write(json.dumps(request) + '\n')
              server.stdin.flush()

              tools = None
              for line in server.stdout:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      message = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if message.get('id') == 2:
                      if 'error' in message:
                          sys.exit(f'tools/list failed: {message["error"]}')
                      tools = [t['name'] for t in message.get('result', {}).get('tools', [])]
                      break
          finally:
              watchdog.cancel()
              server.kill()
              server.wait()

          if tools is None:
              sys.exit('server exited without answering tools/list')
          if 'generate_image_sd35' not in tools:
              sys.exit(f'server did not advertise its tools; got {tools}')
          print(f'OK: {len(tools)} tools advertised')
          PY
